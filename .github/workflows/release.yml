# Builds the SwiftUI GH Watcher (v1) for Apple Silicon and Intel, publishes it as a GitHub release,
# and points the Homebrew cask in alexandernygard/homebrew-tap at it.
#
# Retired: GH Watcher v2 is a rewrite built and released from a Mac, not from this workflow. Tags no
# longer trigger it, so a v2 release tag can't start a v1 build. It can still be run by hand for a v1
# tag.
name: Release (v1, retired)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing v1 tag, such as v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    # The app uses macOS 26 APIs, so it needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build
        run: UNIVERSAL=1 VERSION="$TAG" ./Scripts/build-app.sh release

      - name: Package
        run: |
          ditto -c -k --keepParent "build/GH Watcher.app" build/GH-Watcher.zip
          echo "SHA256=$(shasum -a 256 build/GH-Watcher.zip | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" build/GH-Watcher.zip \
            --title "GH Watcher ${TAG#v}" \
            --generate-notes \
            --verify-tag

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so Casks/gh-watcher.rb in homebrew-tap was not updated. Set version ${TAG#v} and sha256 $SHA256 by hand."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/alexandernygard/homebrew-tap.git" tap
          cd tap
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"${TAG#v}\"/" \
            -e "s/^  sha256 .*/  sha256 \"$SHA256\"/" \
            Casks/gh-watcher.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "gh-watcher ${TAG#v}"
          git push
